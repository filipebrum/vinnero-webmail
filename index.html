<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinnero Email - Webmail</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#1a0f0a] text-[#f5efe6] min-h-screen flex flex-col">

    <!-- Tela de Senha (Proteção do Webmail) -->
    <div id="auth-screen" class="fixed inset-0 bg-[#1a0f0a] z-50 flex items-center justify-center p-4">
        <div class="bg-[#2b1810] border border-[#4a2e23] rounded-2xl p-8 w-full max-w-md shadow-2xl text-center">
            <div class="flex justify-center mb-6">
                <img src="logo-email.png" alt="Vinnero Email" class="h-16 w-auto object-contain[cite: 1]">
            </div>
            <h1 class="text-xl font-semibold mb-2 text-[#f5efe6]">Acesso Restrito</h1>
            <p class="text-sm text-[#d4c3b3] mb-6">Digite a senha para acessar o Vinnero Email.</p>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="password" id="access-password" placeholder="Senha de acesso" required
                    class="w-full px-4 py-3 bg-[#1a0f0a] border border-[#4a2e23] rounded-xl text-[#f5efe6] placeholder-[#8c7365] focus:outline-none focus:border-[#d4c3b3]">
                <button type="submit" 
                    class="w-full py-3 bg-[#4a2e23] hover:bg-[#5c3b2e] text-[#f5efe6] font-medium rounded-xl transition-colors">
                    Entrar
                </button>
            </form>
            <p id="auth-error" class="text-red-400 text-xs mt-3 hidden">Senha incorreta.</p>
        </div>
    </div>

    <!-- Interface Principal do Webmail -->
    <div id="app-screen" class="flex-1 flex flex-col hidden">
        <!-- Cabeçalho -->
        <header class="flex items-center justify-between px-6 py-4 bg-[#2b1810] border-b border-[#4a2e23]">
            <div class="flex items-center space-x-3">
                <img src="logo-email.png" alt="Vinnero Email" class="h-10 w-auto object-contain[cite: 1]">
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="fetchEmails()" class="px-4 py-2 bg-[#4a2e23] hover:bg-[#5c3b2e] text-xs font-medium rounded-lg transition-colors cursor-pointer">
                    Atualizar Caixa
                </button>
                <button onclick="handleLogout()" class="text-xs text-[#d4c3b3] hover:text-[#f5efe6] transition-colors">
                    Sair
                </button>
            </div>
        </header>

        <!-- Corpo Principal -->
        <main class="flex-1 max-w-6xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Lista de E-mails -->
            <div class="bg-[#2b1810] border border-[#4a2e23] rounded-2xl p-4 overflow-y-auto max-h-[75vh]">
                <h2 class="text-sm font-semibold text-[#d4c3b3] uppercase tracking-wider mb-4 px-2">Caixa de Entrada</h2>
                <div id="email-list" class="space-y-2">
                    <p class="text-xs text-[#8c7365] px-2">Carregando mensagens...</p>
                </div>
            </div>

            <!-- Visualização da Mensagem -->
            <div class="md:col-span-2 bg-[#2b1810] border border-[#4a2e23] rounded-2xl p-6 flex flex-col max-h-[75vh] overflow-y-auto">
                <div id="email-detail" class="space-y-4">
                    <div class="text-center py-16 text-[#8c7365]">
                        <p class="text-sm">Selecione um e-mail ao lado para ler o conteúdo.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts de Controle -->
    <script>
        const CORRECT_PASSWORD = "vinnero2026"; // Senha configurada no front-end

        // Verifica se já está autenticado na sessão
        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('vinnero_auth') === 'true') {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                fetchEmails();
            }
        });

        function handleLogin(event) {
            event.preventDefault();
            const pass = document.getElementById('access-password').value;
            if (pass === CORRECT_PASSWORD) {
                sessionStorage.setItem('vinnero_auth', 'true');
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                fetchEmails();
            } else {
                document.getElementById('auth-error').classList.remove('hidden');
            }
        }

        function handleLogout() {
            sessionStorage.removeItem('vinnero_auth');
            location.reload();
        }

        async function fetchEmails() {
            const listContainer = document.getElementById('email-list');
            listContainer.innerHTML = '<p class="text-xs text-[#8c7365] px-2">Atualizando...</p>';
            
            try {
                const res = await fetch('/api/get-emails');
                const emails = await res.json();

                if (!Array.isArray(emails) || emails.length === 0) {
                    listContainer.innerHTML = '<p class="text-xs text-[#8c7365] px-2">Nenhum e-mail recebido ainda.</p>';
                    return;
                }

                listContainer.innerHTML = '';
                emails.forEach((email, index) => {
                    const item = document.createElement('div');
                    item.className = 'p-3 rounded-xl bg-[#1a0f0a] border border-[#4a2e23] hover:border-[#8c7365] cursor-pointer transition-colors';
                    item.innerHTML = `
                        <p class="text-xs font-semibold text-[#f5efe6] truncate">${email.from_email || 'Desconhecido'}</p>
                        <p class="text-xs text-[#d4c3b3] truncate mt-1">${email.subject || '(Sem assunto)'}</p>
                        <span class="text-[10px] text-[#8c7365] mt-2 block">${new Date(email.created_at).toLocaleString()}</span>
                    `;
                    item.onclick = () => displayEmailDetail(email);
                    listContainer.appendChild(item);
                });

                // Seleciona o primeiro por padrão se houver
                if (emails.length > 0) {
                    displayEmailDetail(emails[0]);
                }
            } catch (err) {
                listContainer.innerHTML = '<p class="text-xs text-red-400 px-2">Erro ao carregar e-mails.</p>';
            }
        }

        function displayEmailDetail(email) {
            const detailContainer = document.getElementById('email-detail');
            detailContainer.innerHTML = `
                <div class="border-b border-[#4a2e23] pb-4 mb-4">
                    <span class="text-xs text-[#8c7365]">De:</span>
                    <h2 class="text-sm font-medium text-[#f5efe6]">${email.from_email}</h2>
                    <span class="text-xs text-[#8c7365] mt-2 block">Assunto:</span>
                    <h1 class="text-lg font-semibold text-[#f5efe6]">${email.subject}</h1>
                    <span class="text-xs text-[#8c7365] mt-1 block">${new Date(email.created_at).toLocaleString()}</span>
                </div>
                <div class="text-sm text-[#d4c3b3] whitespace-pre-wrap leading-relaxed">
                    ${email.body || '(Sem conteúdo)'}
                </div>
            `;
        }
    </script>
</body>
</html>
