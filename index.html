<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinnero Webmail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { -webkit-font-smoothing: antialiased; }
        .hidden-view { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Cabeçalho -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 text-rose-800">
                <!-- Ícone de Taça de Vinho -->
                <i data-lucide="wine" class="w-6 h-6"></i>
                <h1 class="text-xl font-bold tracking-tight">Vinnero Mail</h1>
            </div>
            <div class="text-sm font-medium text-slate-500">
                contato@vinnero.com.br
            </div>
        </div>
    </header>

    <!-- Estrutura Principal -->
    <main class="flex-1 max-w-5xl mx-auto w-full flex flex-col md:flex-row gap-6 p-4">

        <!-- Menu Lateral -->
        <aside class="w-full md:w-64 flex flex-col gap-4">
            <button onclick="toggleView('compose')" class="w-full bg-rose-700 hover:bg-rose-800 text-white font-semibold py-3 px-4 rounded-xl shadow-sm transition-colors flex items-center justify-center gap-2">
                <i data-lucide="pen-square" class="w-5 h-5"></i>
                Nova Mensagem
            </button>

            <nav class="flex flex-row md:flex-col gap-2 overflow-x-auto md:overflow-visible pb-2 md:pb-0 scrollbar-hide">
                <button onclick="toggleView('inbox')" id="btn-inbox" class="flex-1 md:flex-none flex items-center gap-3 px-4 py-3 bg-white text-rose-700 rounded-lg border border-slate-200 shadow-sm font-medium whitespace-nowrap transition-colors">
                    <i data-lucide="inbox" class="w-5 h-5"></i>
                    Caixa de Entrada
                </button>
                <button class="flex-1 md:flex-none flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors whitespace-nowrap">
                    <i data-lucide="send" class="w-5 h-5"></i>
                    Enviados
                </button>
            </nav>
        </aside>

        <!-- Área de Conteúdo -->
        <section class="flex-1 bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden min-h-[500px] flex flex-col">

            <!-- Tela: Caixa de Entrada -->
            <div id="inbox-view" class="flex flex-col h-full flex-1">
                <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                    <h2 class="text-lg font-semibold text-slate-8
